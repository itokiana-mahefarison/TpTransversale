version: 1.0
project_id: hotel_elt
default_environment: dev

environments:
  - name: dev

plugins:
  extractors:
    - name: tap-postgres
      variant: meltanolabs
      config:
        host: hotel_postgres
        port: 5432
        user: hotel_admin
        password: hotel@123
        database: hotel_db
      select:
        - historique_reservations
        - reservations_par_hotel
        - tendances_visites_ville
        - tendances_saisonnieres
        - preferences_clients

  loaders:
    - name: target-cassandra
      variant: coeff
      config:
        contact_points:
          - hotel_cassandra
        keyspace: tourisme_keyspace
        username: cassandra
        password: cassandra

  transformers:
    - name: dbt-postgres
      variant: dbt-labs

jobs:
  - name: elt-historique-reservations
    tasks:
      - dbt-postgres:run
      - tap-postgres target-cassandra
  - name: elt-reservations-par-hotel
    tasks:
      - dbt-postgres:run
      - tap-postgres target-cassandra
  - name: elt-tendances-visites-ville
    tasks:
      - dbt-postgres:run
      - tap-postgres target-cassandra
  - name: elt-tendances-saisonnieres
    tasks:
      - dbt-postgres:run
      - tap-postgres target-cassandra
  - name: elt-preferences-clients
    tasks:
      - dbt-postgres:run
      - tap-postgres target-cassandra

schedules:
  - name: historique-reservations-mensuel
    interval: "@monthly"
    job: elt-historique-reservations
    env:
      EXTRACTION_START_DATE: "{{ prev_month_start }}"
      EXTRACTION_END_DATE: "{{ prev_month_end }}"
  - name: reservations-par-hotel-mensuel
    interval: "@monthly"
    job: elt-reservations-par-hotel
    env:
      EXTRACTION_START_DATE: "{{ prev_month_start }}"
      EXTRACTION_END_DATE: "{{ prev_month_end }}"
  - name: tendances-visites-ville-mensuel
    interval: "@monthly"
    job: elt-tendances-visites-ville
    env:
      EXTRACTION_START_DATE: "{{ prev_month_start }}"
      EXTRACTION_END_DATE: "{{ prev_month_end }}"
  - name: tendances-saisonnieres-mensuel
    interval: "@monthly"
    job: elt-tendances-saisonnieres
    env:
      EXTRACTION_START_DATE: "{{ prev_month_start }}"
      EXTRACTION_END_DATE: "{{ prev_month_end }}"
  - name: preferences-clients-mensuel
    interval: "@monthly"
    job: elt-preferences-clients
    env:
      EXTRACTION_START_DATE: "{{ prev_month_start }}"
      EXTRACTION_END_DATE: "{{ prev_month_end }}"

# Notes :
# - Les modèles dbt doivent être créés dans le dossier /meltano/dbt/ (un modèle par table cible)
# - Les variables EXTRACTION_START_DATE et EXTRACTION_END_DATE sont à utiliser dans les modèles dbt pour filtrer sur le mois précédent
# - Le loader target-cassandra est configuré pour se connecter au service Docker hotel_cassandra
# - Adapter le schéma dbt (analytics) si besoin
# - Après modification, exécuter 'meltano install' dans le conteneur meltano 